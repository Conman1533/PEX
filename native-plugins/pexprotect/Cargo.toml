[package]
name = "pexprotect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0"
description = "Block logging, lookups, inspection, rollback and restore for PEX."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pex-common = { path = "../common" }
pumpkin = { path = "../../crates/pumpkin-core", package = "pumpkin-core" }
pumpkin-data.workspace = true
pumpkin-util.workspace = true
pumpkin-world.workspace = true
tracing.workspace = true
uuid.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }

[lints]
workspace = true
